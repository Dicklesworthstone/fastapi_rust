[workspace]
resolver = "2"
members = [
    "crates/fastapi",
    "crates/fastapi-core",
    "crates/fastapi-http",
    "crates/fastapi-router",
    "crates/fastapi-macros",
    "crates/fastapi-openapi",
    "crates/fastapi-types",
    "crates/fastapi-output",
]

[workspace.package]
version = "0.4.3"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/Dicklesworthstone/fastapi_rust"
homepage = "https://github.com/Dicklesworthstone/fastapi_rust"

[workspace.dependencies]
# Runtime (our own) - uses crates.io in CI/publishing; override with path in .cargo/config.toml for local dev.
# default-features = false keeps asupersync's `nightly-outcome-try` default off so the
# workspace builds on stable (MSRV 1.95); consumers can enable extra asupersync features themselves.
asupersync = { version = "0.4.9", default-features = false }

# Serialization (only these)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Internal crates
fastapi-rust = { path = "crates/fastapi", version = "0.4.3" }
fastapi-core = { path = "crates/fastapi-core", version = "0.4.3", default-features = false }
fastapi-http = { path = "crates/fastapi-http", version = "0.4.3" }
fastapi-router = { path = "crates/fastapi-router", version = "0.4.3" }
fastapi-macros = { path = "crates/fastapi-macros", version = "0.4.3" }
fastapi-openapi = { path = "crates/fastapi-openapi", version = "0.4.3" }
fastapi-types = { path = "crates/fastapi-types", version = "0.4.3" }
fastapi-output = { path = "crates/fastapi-output", version = "0.4.3" }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allow these during early development
doc_markdown = "allow"
missing_const_for_fn = "allow"
doc_link_with_quotes = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# New in nightly-2026-08-19 clippy: prefers `assert_eq!(v, [] as [T; 0])` over
# `assert!(v.is_empty())`, which is less readable in test code.
assert_is_empty = "allow"
# Fires workspace-wide since rust-version moved to 1.95 (clippy now assumes
# let-chains are available): ~60 nested-`if` sites, mostly in fastapi-macros.
# Collapsing them into let-chains is a separate mechanical refactor; tracked in beads.
collapsible_if = "allow"
# Trait contracts (FromRequest, Middleware, ...) mandate async signatures;
# impls that happen not to await cannot drop `async` without desugaring.
unused_async_trait_impl = "allow"
